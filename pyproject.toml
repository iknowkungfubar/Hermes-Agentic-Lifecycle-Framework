[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-half"
version = "1.0.0"
description = "Hermes Agentic Lifecycle Framework — transform concepts into production software"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hermes Agent / Turin Tech Solutions", email = "josh@turintechsolutions.com"}
]
requires-python = ">=3.13"
keywords = ["half", "lifecycle", "sdlc", "agentic-se", "automation", "ci-cd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=1.0",
    "cryptography>=48.0.1",
    "starlette>=1.3.1",
]

[project.urls]
"Homepage" = "https://github.com/iknowkungfubar/Hermes-Agentic-Lifecycle-Framework"
"Documentation" = "https://github.com/iknowkungfubar/Hermes-Agentic-Lifecycle-Framework#readme"
"Repository" = "https://github.com/iknowkungfubar/Hermes-Agentic-Lifecycle-Framework"
"Changelog" = "https://github.com/iknowkungfubar/Hermes-Agentic-Lifecycle-Framework/blob/master/CHANGELOG.md"
"Issues" = "https://github.com/iknowkungfubar/Hermes-Agentic-Lifecycle-Framework/issues"

[project.scripts]
half = "half.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "pre-commit>=4.0",
    "hypothesis>=6.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "bandit>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["half*"]

[tool.setuptools.package-data]
half = ["data/scripts/genesis.sh", "data/docker/docker-compose.foss.yml", "data/templates/*"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",         # docstring rules
    "ANN",       # annotation rules
    "COM812",    # trailing comma
    "INP001",    # implicit namespace package
    "FBT001",    # boolean positional args
    "FBT002",
    "S101",      # allow assert in tests
    # Pre-existing — accumulated during active development with select=ALL
    "E501",      # line-too-long
    "PLC0415",   # import-outside-top-level
    "PLW1510",   # subprocess-run-without-check
    "PLR2004",   # magic-value-comparison
    "BLE001",    # blind-except
    "S607",      # start-process-with-partial-path
    "S603",      # subprocess-without-shell-equals-true
    "PERF401",   # manual-list-comprehension
    "TRY300",    # try-consider-else
    "ARG001",    # unused-function-argument
    "ARG002",    # unused-method-argument
    "S110",      # try-except-pass
    "B904",      # raise-without-from-inside-except
    "PLR0913",   # too-many-arguments
    "TRY401",    # verbose-log-message
    "C901",      # complex-structure
    "F401",      # unused-import
    "RUF012",    # mutable-class-default
    "S310",      # suspicious-url-open-usage
    "E402",      # module-import-not-at-top-of-file
    "E741",      # ambiguous-variable-name
    "PTH123",    # builtin-open
    "S112",      # try-except-continue
    "SIM102",    # collapsible-if
    "T201",      # print
    "PLR0912",   # too-many-branches
    "S108",      # hardcoded-temp-file
    "A002",      # builtin-argument-shadowing
    "ARG004",    # unused-static-method-argument
    "DTZ005",    # call-datetime-now-without-tzinfo
    # Pre-existing — second batch
    "EXE001",    # shebang-not-executable
    "PLR0911",   # too-many-return-statements
    "PLW0603",   # global-statement
    "PTH107",    # os-remove
    "PTH110",    # os-path-exists
    "PTH111",    # os-path-expanduser
    "SLF001",    # private-member-access
    "UP035",     # deprecated-import
    "B015",      # useless-comparison
    "PLR0915",   # too-many-statements
    "PLW2901",   # redefined-loop-name
    "PTH103",    # os-makedirs
    "PTH108",    # os-unlink
    "PTH207",    # glob
    "S311",      # suspicious-non-cryptographic-random-usage
    "S602",      # subprocess-popen-with-shell-equals-true
    "S608",      # hardcoded-sql-expression
    "SIM105",    # suppressible-exception
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002"]
"scripts/**" = ["T201", "INP001"]
"src/half_voice/engine.py" = ["S603"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_untyped_defs = false
disallow_untyped_decorators = false
exclude = [
    "src-tauri/",
    ".venv/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short"
filterwarnings = [
    "ignore::ResourceWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that need network access",
    "integration: marks integration tests",
    "unit: marks unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    "src-tauri/*",
    "src/half/half_voice/engine.py",
]

[tool.coverage.report]
fail_under = 74
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
