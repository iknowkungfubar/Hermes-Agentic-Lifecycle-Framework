# Usage: docker compose -f docker/docker-compose.foss.yml up -d
# WARNING: Change all default passwords before production use!

version: "3.8"

networks:
  half-observability:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  langwatch_data:
  postgres_data:
  focalboard_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: half-postgres
    networks: [half-observability]
    environment:
      POSTGRES_DB: half
      POSTGRES_USER: half
      POSTGRES_PASSWORD: ${HALF_DB_PASSWORD:-half_secret}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U half"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: half-redis
    networks: [half-observability]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  langwatch:
    image: ghcr.io/langwatch/langwatch:latest
    container_name: half-langwatch
    networks: [half-observability]
    ports: ["127.0.0.1:3100:3000"]
    environment:
      DATABASE_URL: postgresql://half:***@postgres:5432/half
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  laminar:
    image: ghcr.io/lmnr-ai/lmnr:latest
    container_name: half-laminar
    networks: [half-observability]
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      LMNR_DATABASE_URL: postgresql://half:***@postgres:5432/half
      LMNR_REDIS_URL: redis://redis:6379/0
      OTEL_ARROW_ENABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: half-prometheus
    networks: [half-observability]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: half-grafana
    networks: [half-observability]
    ports: ["127.0.0.1:3300:3000"]
    volumes: [grafana_data:/var/lib/grafana]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${HALF_GRAFANA_PASSWORD:-change-me}
    depends_on: [prometheus]
    restart: unless-stopped

  agent-mail:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent-mail
    container_name: half-agent-mail
    networks: [half-observability]
    ports: ["127.0.0.1:9721:9721"]
    volumes: [..:/workspace:ro]
    restart: unless-stopped

  focalboard:
    image: mattermost/focalboard:latest
    container_name: half-focalboard
    networks: [half-observability]
    ports: ["127.0.0.1:8200:8000"]
    volumes:
      - focalboard_data:/data
      - ./docker/focalboard-config.json:/config.json:ro
    environment:
      FB_SERVER_PORT: 8000
      FB_DB_TYPE: sqlite3
      FB_DB_FILE: /data/focalboard.db
    restart: unless-stopped
