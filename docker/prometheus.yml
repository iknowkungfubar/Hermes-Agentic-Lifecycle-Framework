# HALF — Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "half-app"
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: /metrics

  - job_name: "half-agent-mail"
    static_configs:
      - targets: ["agent-mail:9721"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
