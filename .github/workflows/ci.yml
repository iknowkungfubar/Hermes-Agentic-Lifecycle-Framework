name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src/ --quiet
      - run: ruff format src/ --check --quiet

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7 # v5
      - run: uv sync --group dev
      - run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7 # v5
      - run: uv sync --group dev
      - run: uv run pip install -e .
      - run: uv run pytest tests/ -q --tb=no --cov=src/half --cov-fail-under=73 --asyncio-mode=auto --ignore=tests/coverage --ignore=tests/infrastructure --ignore=tests/integration

  integration:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7 # v5
      - run: uv sync --group dev
      - run: uv run pip install -e .
      - name: Install integration test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Start HTTP sidecar
        run: |
          PYTHONPATH=. uv run python -m half.http_sidecar &
          for i in $(seq 1 10); do
            sleep 1
            curl -sf http://127.0.0.1:9721/api/status && break
          done
      - name: Run integration tests
        run: uv run pytest tests/integration/ -q --tb=no
      - name: Cleanup
        run: pkill -f "half.http_sidecar" || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7 # v5
      - run: uv sync --group dev
      - run: uv run bandit -r src/half -ll --quiet || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  build:
    needs: [lint, type-check, test, security, secrets-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7 # v4
      - run: docker build -t half:latest -f docker/Dockerfile .
      - run: echo "Build successful"
