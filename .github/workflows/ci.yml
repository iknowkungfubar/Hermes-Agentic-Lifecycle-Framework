name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f76 # v5.5.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src/ --quiet
      - run: ruff format src/ --check --quiet

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f76 # v5.5.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835654d32e2b0b0d4b492a561 # v5.0.0
      - run: uv sync --group dev
      - run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f76 # v5.5.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835654d32e2b0b0d4b492a561 # v5.0.0
      - run: uv sync --group dev
      - run: uv run pip install -e .
      - run: uv run pytest tests/ -q --tb=no --cov=src/half --cov-fail-under=74 --asyncio-mode=auto --ignore=tests/coverage --ignore=tests/infrastructure --ignore=tests/integration

  integration:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f76 # v5.5.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835654d32e2b0b0d4b492a561 # v5.0.0
      - run: uv sync --group dev
      - run: uv run pip install -e .
      - name: Start HTTP sidecar
        run: |
          PYTHONPATH=. uv run python -m half.http_sidecar &
          sleep 3
          curl -sf http://127.0.0.1:9721/api/status
      - name: Run integration tests
        run: uv run pytest tests/integration/ -q --tb=no
      - name: Cleanup
        run: pkill -f "half.http_sidecar" || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f76 # v5.5.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835654d32e2b0b0d4b492a561 # v5.0.0
      - run: uv sync --group dev
      - run: uv run bandit -r src/half -ll --quiet

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@83373c2ad3a2a111826378c0612e8fba88d78ec7 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
      - uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3

  build:
    needs: [lint, type-check, test, security, secrets-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t half:latest -f docker/Dockerfile .
      - run: echo "Build successful"
