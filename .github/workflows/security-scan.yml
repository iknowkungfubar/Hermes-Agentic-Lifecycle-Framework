name: Weekly Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday 6AM UTC
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5 # v5
      - run: uv sync --group dev
      - run: uv run bandit -r src/ -f json -o bandit-report.json || true
      - run: uv run pip-audit || true
      - name: Upload reports
        uses: actions/upload-artifact@v7 # v4
        with:
          name: security-reports
          path: |
            bandit-report.json
