name: Weekly Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday 6AM UTC
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v6.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v7.0.0
      - run: uv sync --group dev
      - run: uv run bandit -r src/ -f json -o bandit-report.json || true
      - run: uv run pip-audit || true
      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f48907d331 # v7.0.2
        with:
          name: security-reports
          path: |
            bandit-report.json
