# SPIFFE/SPIRE Identity Configuration
# HALF 1.5 — Cryptographic Agent Identities for Zero-Trust
#
# This file defines the SPIFFE/SPIRE identity configuration for HALF agent sandboxes.
# Each ephemeral Podman container and micro-agent is issued a cryptographically
# verifiable SPIFFE Verifiable Identity Document (SVID).
#
# Prerequisites:
#   - SPIRE Server and Agent installed: https://spiffe.io/docs/latest/deploying/
#   - Rootless Podman configured
#   - Kernel ≥5.7 for eBPF support
#
# Installation:
#   spire-server run -config server.conf &
#   spire-agent run -config agent.conf &

# ─── SPIRE Server Configuration ──────────────────────────────────────────────
server {
    bind_address = "127.0.0.1"
    bind_port = "8081"
    trust_domain = "half.local"
    data_dir = "/var/lib/spire/half"
    log_level = "INFO"

    ca_subject {
        country = "US"
        organization = "Turin Tech Solutions"
        common_name = "HALF Agentic OS"
    }
}

# ─── SPIRE Agent Configuration ──────────────────────────────────────────────
agent {
    data_dir = "/var/lib/spire/agent/half"
    log_level = "INFO"
    server_address = "127.0.0.1"
    server_port = "8081"
    trust_domain = "half.local"

    # Join token for agent attestation
    join_token = "half-agent-join-token"
}

# ─── Workload Registration Entries ──────────────────────────────────────────
# Each agent role gets its own SPIFFE identity

entries {
    # PDA/Commander Agent — full access
    spiffe_id = "spiffe://half.local/pda"
    parent_id = "spiffe://half.local/host"
    selector {
        type = "unix"
        value = "uid:1000"
    }

    # Coder Agent — code generation sandbox
    spiffe_id = "spiffe://half.local/agent/coder"
    parent_id = "spiffe://half.local/podman"
    selector {
        type = "podman"
        value = "label:half.role=coder"
    }

    # Security Agent — vulnerability scanning
    spiffe_id = "spiffe://half.local/agent/security"
    parent_id = "spiffe://half.local/podman"
    selector {
        type = "podman"
        value = "label:half.role=security"
    }

    # Database Agent — schema migrations
    spiffe_id = "spiffe://half.local/agent/migration"
    parent_id = "spiffe://half.local/podman"
    selector {
        type = "podman"
        value = "label:half.role=dba"
    }

    # Agent Mail — inter-agent communication
    spiffe_id = "spiffe://half.local/service/agent-mail"
    parent_id = "spiffe://half.local/host"
    selector {
        type = "unix"
        value = "pid:agent-mail"
    }
}

# ─── eBPF Grimlock Datapath Configuration ───────────────────────────────────
# Enforces zero-trust inter-agent communication at the kernel level.
# Requires Linux kernel ≥5.7 with BPF CO-RE support.
#
# grimlock_rules:
#   - All inter-agent traffic must pass through kTLS with SPIRE-issued certs
#   - Agents can only communicate with their authorized peers (by SPIFFE ID)
#   - No agent can exfiltrate data to external IPs outside allowed list
#   - Podman sandboxes have zero network access by default

grimlock {
    enabled = false  # Set to true after eBPF hook injection
    interface = "lo"
    ktls_enabled = true
    allowed_peers = [
        "spiffe://half.local/pda",
        "spiffe://half.local/service/agent-mail",
    ]

    # eBPF program paths (compiled .o files)
    program_tc = "/etc/halve/grimlock/tc.o"       # Traffic control ingress/egress
    program_xdp = "/etc/halve/grimlock/xdp.o"     # XDP packet filtering

    # Sandbox network policy
    sandbox_network = "none"  # none, isolated, authorized-only
    allowed_external = []     # Empty = no external access
}

# ─── Test Verification ───────────────────────────────────────────────────────
# Run these commands to verify SPIFFE/SPIRE is working:
#
#   # Check SPIRE server status
#   spire-server healthcheck
#
#   # List registered workloads
#   spire-server entry show
#
#   # Verify agent can fetch SVID
#   spire-agent api fetch -socketPath /tmp/agent.sock
#
#   # Check eBPF programs are loaded
#   sudo bpftool prog list | grep grimlock
