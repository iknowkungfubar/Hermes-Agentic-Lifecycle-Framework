# HALF Execution Safety Constraints
sandbox:
  enabled: true
  runtime: podman  # or docker
  network: none
  read_only_mounts:
    - source: vault_root
      target: /workspace/vault
      type: ro
  dangerous_commands:
    - "rm -rf /"
    - "dd if="
    - "mkfs"
    - "format"
    - ":(){ :|:& };:"
hook_constraints:
  reject_path_traversal: true
  max_command_length: 4096
